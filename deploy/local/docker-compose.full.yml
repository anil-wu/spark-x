services:
  service:
    build:
      context: ../../service
      dockerfile: Dockerfile
    image: sparkplay-service:local
    container_name: sparkplay-service
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-6001}:8890"
    environment:
      - MYSQL_DSN=${MYSQL_USER:-sparkplay}:${MYSQL_PASSWORD:-sparkplay}@tcp(mysql:3306)/${MYSQL_DATABASE:-sparkplay}?charset=utf8mb4&parseTime=true&loc=Local
      - SPARKX_SUPER_EMAIL=${SPARKX_SUPER_EMAIL:-}
      - SPARKX_SUPER_PASSWORD=${SPARKX_SUPER_PASSWORD:-}
      - SPARKX_SUPER_USERNAME=${SPARKX_SUPER_USERNAME:-}
      - AUTH_ACCESS_SECRET=${AUTH_ACCESS_SECRET:-dev-user-secret}
      - ADMIN_AUTH_ACCESS_SECRET=${ADMIN_AUTH_ACCESS_SECRET:-dev-admin-secret}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_ACCESS_KEY_SECRET=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-sparkplay}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
    command: ["-f", "/app/etc/sparkx-api-dev.yaml"]
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command: --bind-address=0.0.0.0
    container_name: sparkplay-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sparkplay}
      MYSQL_USER: ${MYSQL_USER:-sparkplay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sparkplay}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sparkplay}
    ports:
      - "${MYSQL_PORT:-6003}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: sparkplay-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: sparkplay-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sparkplay}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p "local/$$S3_BUCKET" || true
        mc anonymous set none "local/$$S3_BUCKET" || true
        exit 0
  web:
    build:
      context: ../../web
      dockerfile: Dockerfile
    image: sparkplay-web:local
    container_name: sparkplay-web
    restart: unless-stopped
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    ports:
      - "${WEB_PORT:-80}:3000"
    depends_on:
      - service
  web-api:
    build:
      context: ../..
      dockerfile: web_api/Dockerfile
    image: sparkplay-web-api:local
    container_name: sparkplay-web-api
    restart: unless-stopped
    ports:
      - "${WEB_API_PORT:-6002}:8080"
    depends_on:
      - service
  web-admin:
    build:
      context: ../../web_admin
      dockerfile: Dockerfile
    image: sparkplay-web-admin:local
    container_name: sparkplay-web-admin
    restart: unless-stopped
    ports:
      - "${WEB_ADMIN_PORT:-6004}:80"
    depends_on:
      - service

volumes:
  mysql_data:
  minio_data:
