services:
  opencode:
    build: ../../opencode
    image: sparkplay-opencode:local
    container_name: opencode-service
    entrypoint: ["/opt/start-all.sh"]
    working_dir: /workspace
    ports:
      - "4096:4096"
      - "7070:7070"
    volumes:
      - ../opencode/workspace:/workspace
      - ../../opencode/opencode.json:/workspace/opencode.json:ro
      - ../../opencode/.opencode:/workspace/.opencode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENCODE_CONFIG=/workspace/opencode.json
      - OPENCODE_CONFIG_PATH=/workspace/opencode.json
      - API_SERVICE_API_KEY=${API_SERVICE_API_KEY:-123456}
      - SPARKX_API_BASE_URL=${SPARKX_API_BASE_URL:-https://host.docker.internal:8890}
      - OPENCODE_WORKSPACE_DIR=/workspace
      - WORKSPACE_MGR_TOKEN=${WORKSPACE_MGR_TOKEN:-123456}
    restart: unless-stopped
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    command: --bind-address=0.0.0.0
    container_name: sparkplay-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sparkplay}
      MYSQL_USER: ${MYSQL_USER:-sparkplay}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sparkplay}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sparkplay}
    ports:
      - "${MYSQL_PORT:-6003}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: sparkplay-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: sparkplay-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sparkplay}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p "local/$$S3_BUCKET" || true
        mc anonymous set none "local/$$S3_BUCKET" || true
        exit 0

volumes:
  mysql_data:
  minio_data:
